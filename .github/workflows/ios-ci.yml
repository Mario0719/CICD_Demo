name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Job 名 "test" 会出现在 PR Checks / 分支保护的可选列表里
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
        continue-on-error: true

      - name: Run tests (Fastlane)
        env:
          # GitHub 虚拟机上的模拟器名可能与本地不同，可按 Actions 日志调整
          CI_SIMULATOR: iPhone 16
        run: |
          if bundle check 2>/dev/null; then
            bundle exec fastlane test
          else
            gem install fastlane -N
            fastlane test
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            fastlane/test_output/report.html
            fastlane/test_output/report.junit
            fastlane/test_output/CICD_Demo.xcresult
          if-no-files-found: warn

name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Pick available iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -8
          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/^[[:space:]]*([^(]+).*/\1/' | xargs)
          echo "Using simulator: $SIM_NAME"
          echo "CI_SIMULATOR=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
        continue-on-error: true

      - name: Run tests (Fastlane)
        run: |
          if bundle check 2>/dev/null; then
            bundle exec fastlane test
          else
            gem install fastlane -N --no-document
            fastlane test
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            fastlane/test_output/report.html
            fastlane/test_output/report.junit
            fastlane/test_output/CICD_Demo.xcresult
          if-no-files-found: warn
